<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Vendedor - NetCulture</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: white;
        }

        .navbar {
            background-color: #24860c;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            padding: 50px;
            max-width: 600px;
            margin: 0 auto;
        }

        .container h1 {
            color: #24860c;
            text-align: center;
            font-size: 28px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            color: #24860c;
            font-size: 16px;
            margin-bottom: 5px;
            display: block;
        }

        .input-field {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .input-field:focus {
            border-color: #24860c;
            outline: none;
        }

        .button {
            background-color: #24860c;
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #1e6a0a;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #24860c;
            font-size: 14px;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <a href="#">NETCULTURE</a>
    </div>

    <!-- Formulário de Cadastro -->
    <div class="container">
        <h1>Cadastro de Vendedor</h1>
        <form>
            
            <!-- Campo Nome -->
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" class="input-field" required>
            </div>

            <!-- Campo WhatsApp -->
            <div class="form-group">
                <label for="whatsapp">WhatsApp</label>
                <input type="tel" id="whatsapp" name="whatsapp" class="input-field" required>
            </div>

            <!-- Campo Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="input-field" required>
            </div>

            <!-- Campo Senha -->
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" class="input-field" required>
            </div>

            <!-- Campo Descrição -->
            <div class="form-group">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao" class="input-field" rows="4" required></textarea>
            </div>

            <!-- Botão de Cadastro -->
            <button type="submit" class="button">Cadastrar</button>
        </form>

        <!-- Link para voltar -->
        <div class="back-link">
            <p>Já tem uma conta? <a href="loginVendedor.html">Faça login aqui</a></p>
        </div>
    </div>

</body>
</html>
